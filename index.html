<!--
  ============================================================
  thecheekycrab.com  —  The Adventures of Crabby
  ============================================================

  This is the site's home page. The whole site is:

      index.html                          this file — the home page
      about/aboutcrabby.html              the "About Crabby" page
      about/aboutsofia.html               the "About Sofia" page
      stories/stories-index.html     the "Stories" list page (links to every story)
      activity-corner.html                the "Activity Corner" page (games based on the stories)
      coming-soon.html                    placeholder for the not-yet-built pages
      images/mainpagebackground.webp      this page's illustration
      images/Crabby Image.png             the About Crabby thumbnail
      images/Sofia Image.png              the About Sofia thumbnail
      images/Mango Ice Cream Stall.png    the Stories link's thumbnail

      The stories themselves (crabby-and-the-mango-ice-cream.html and
      their pictures) live in stories/ and images/ too, but aren't
      linked directly from this page any more — see "ABOUT THE LINK
      HOTSPOTS" below.

  HOW TO EDIT IT
  --------------
  Open this file in a plain text editor. VS Code is free and
  ideal; Notepad works. Do NOT open or save it in Microsoft
  Word — Word rewrites it into broken markup.

  Everything you're likely to change is marked with a comment
  beginning "EDIT:". The colours live together in the :root
  block near the top of the style section.

  To preview a change: save, then double-click index.html. It
  opens in your browser. Edit, save, refresh.

  ABOUT THE TITLE, BUTTONS AND WOODEN SIGN
  --------------------------------------
  The title ("The Adventures of Crabby"), the byline, the intro
  sentence, and the five round buttons along the bottom (Crab
  Stories / Meet the Crab / Crab Facts / Activity Corner /
  Contact) are all part of the illustration itself
  (images/mainpagebackground.webp) — they're painted into the
  picture, not drawn separately by this page. To change any of
  that wording or artwork, you need a new illustration with the
  new text/buttons baked in; this file has no separate lettering
  to edit for those. What this page DOES add on top is five
  invisible clickable circles, positioned exactly on top of
  those five painted buttons — see "ABOUT THE LINK HOTSPOTS"
  below.

  ABOUT THE PICTURE FILLING THE SCREEN
  --------------------------------------
  The picture is sized by the script at the bottom of the page,
  not by CSS alone, because every visitor's screen is a different
  shape from the artwork (1968 x 1568) and the picture has to be
  shown in full, without ever stretching, distorting, or cropping
  into the title lettering, the sign, or the row of round buttons.

  Because the title/sign/buttons stretch right across the artwork
  with almost no safe margin, the script fits the picture like a
  photo "contain" fit: it grows the picture until it's as large as
  possible while still fitting entirely inside the screen, then
  centres it. On a screen shaped very differently from the artwork
  (e.g. a tall phone), that leaves a thin strip of the page
  background (--paper) above/below or left/right of the picture,
  rather than ever cropping any of it away. The two numbers
  MAX_V_CROP and MAX_H_CROP near the top of the script allow a
  small amount of edge crop instead of letterboxing, if you ever
  want a more edge-to-edge look — raise them cautiously, since the
  title, sign and buttons now run close to every edge.

  ABOUT THE LINK HOTSPOTS
  ----------------------
  Five invisible, circular clickable areas sit right on top of the
  five round buttons painted into the picture ("Crab Stories",
  "Meet the Crab", "Crab Facts", "Activity Corner", "Contact").
  Because they're positioned in PERCENTAGES of the picture's own
  box (not fixed pixels), they land in exactly the right spot on
  the buttons no matter how large or small the picture is drawn —
  no JavaScript positioning math is needed for them.

  Each hotspot is a plain <a class="hotspot"> inside the .plate div
  in the BODY section, with its own class (hotspot-1 .. hotspot-5)
  giving it a left/top/width/height in the style section, all as
  percentages. If you ever need to nudge one (say, a future
  illustration shifts the buttons slightly), adjust that hotspot's
  percentages in the "HOTSPOT POSITIONS" part of the style section
  — open the picture at its native size, find the button's pixel
  box, and convert to percent of 1968 (width) / 1568 (height).

  These hotspots only apply on wide/landscape screens — see "ABOUT
  THE MOBILE (PORTRAIT) LAYOUT" below for what happens on a phone.

  ABOUT THE MOBILE (PORTRAIT) LAYOUT
  --------------------------------------
  This illustration is landscape-shaped (wider than tall), but a
  phone held upright is the opposite — so there's no way to show
  the whole picture edge-to-edge on a portrait phone without either
  shrinking it small (leaving big blank paper bars top and bottom)
  or cropping its sides. This page chooses to crop: on any screen
  taller than it is wide, the script at the bottom switches to a
  different mode that zooms the picture in to fill the entire
  screen top-to-bottom, keeping Crabby himself in view, and simply
  accepts that the far left/right edges of the artwork (and
  therefore some of the five round buttons) get cropped off.

  Because the buttons may be partly or fully cropped on a phone,
  their hotspots are hidden in this mode, and a small round menu
  button appears in the top-right corner instead — tapping it
  drops down a plain list of the same five links. That menu's HTML
  is the <nav class="mobile-nav"> block in the BODY section, right
  after the .plate div; its five links are a second, independent
  copy of the hotspot links above, so if you change a destination
  in one place, change it in the other too.

  EDIT: FOCUS_X (in the script) is the horizontal point of the
  picture, in the artwork's own pixels (0-1968), that stays
  centred on a phone screen — it's set to sit on Crabby. Move it
  left/right if a future illustration repositions him.

  Currently:
    - "Crab Stories"    → /stories/stories-index (the page listing
                           every story)
    - "Meet the Crab"    → /about/aboutcrabby
    - "Activity Corner"  → /activity-corner (word search, quiz,
                           story-ordering game, colouring page and
                           a writing space, all based on the two
                           stories so far)
    - "Crab Facts" and "Contact" both → coming-soon.html, a small
      placeholder page that just says "Under Construction — check
      back soon" until those sections are built.
  ============================================================
--><html lang="en-AU"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title>The Adventures of Crabby</title>

<!-- EDIT: the one-line description search engines show -->
<meta name="description" content="The Adventures of Crabby — a children's picture book.">

<meta property="og:title" content="The Adventures of Crabby">
<meta property="og:description" content="A children's picture book">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thecheekycrab.com/">
<meta property="og:image" content="https://thecheekycrab.com/images/mainpagebackground.webp">

<style>
  /* ==========================================================
     COLOURS — sampled from the illustration so the page and the
     picture blend into one another. Change these to restyle.
     ========================================================== */
  :root {
    --paper: #fbf4dd;   /* page background — matches the artwork's edge */
    --ink:   #163a5c;   /* the lettering — deep navy                    */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    position: relative;
    overflow: hidden;      /* the picture is centred in the viewport,
                              so the page itself never scrolls */
  }

  /* The picture sits inside this box. Its width/height are set in
     pixels by the script at the bottom of the page — see "ABOUT THE
     PICTURE FILLING THE SCREEN". The five hotspot links below are
     positioned in percentages of THIS box, so they track the
     picture's five painted buttons automatically at any size. */
  .plate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rise 1s cubic-bezier(.22,.61,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 14px)); }
    to   { opacity: 1; transform: translate(-50%, -50%);              }
  }

  /* EDIT: on a portrait phone the script (see "ABOUT THE MOBILE
     (PORTRAIT) LAYOUT" up top) adds this class instead of sizing
     the plate to the picture's own shape — it makes the plate fill
     the whole screen edge-to-edge so the picture can be zoomed in
     and cropped to fit, rather than letterboxed. */
  .plate.mode-mobile {
    position: fixed;
    inset: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: none;
    animation: fade-in .6s ease both;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .plate img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ===================== MOBILE MENU ===================== */
  /* EDIT: the round menu button, top-right corner — only shown on
     portrait phones (see "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up
     top). Hidden entirely otherwise. */
  .menu-btn {
    display: none;
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 20;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 4px 14px rgba(90, 66, 30, .35);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }

  .menu-btn span {
    display: block;
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: var(--ink);
    transition: transform .2s ease, opacity .2s ease;
  }

  body.is-portrait .menu-btn { display: flex; }

  /* the "X" cross the menu button turns into once the menu is open */
  body.menu-open .menu-btn span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  body.menu-open .menu-btn span:nth-child(2) { opacity: 0; }
  body.menu-open .menu-btn span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* EDIT: the dropdown list of links itself. Hidden by default;
     "menu-open" on <body> (toggled by the button's click handler
     in the script) slides it into view. */
  .mobile-nav {
    position: fixed;
    top: 78px;
    right: 18px;
    z-index: 19;
    display: none;
    flex-direction: column;
    gap: 8px;
    background: rgba(255, 255, 255, .96);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(90, 66, 30, .35);
    padding: 14px;
    min-width: 190px;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .18s ease, transform .18s ease;
  }

  body.is-portrait .mobile-nav { display: flex; }

  body.is-portrait.menu-open .mobile-nav {
    opacity: 1;
    transform: translateY(0);
  }

  .mobile-nav a {
    display: block;
    padding: 10px 14px;
    border-radius: 9px;
    background: #f4ecd8;
    color: var(--ink);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
  }

  .mobile-nav a:active { background: #ecdfc0; }

  /* EDIT: the five invisible clickable circles sat on top of the
     picture's own painted buttons — see "ABOUT THE LINK HOTSPOTS"
     up top. They have no visible fill by default; a very soft
     highlight appears on hover/focus so visitors can tell they're
     clickable. */
  .hotspot {
    position: absolute;
    border-radius: 50%;
    display: block;
    -webkit-tap-highlight-color: rgba(22, 58, 92, .15);
  }

  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(255, 255, 255, .18);
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
  }

  /* HOTSPOT POSITIONS — percentages of the picture's own box,
     measured from the artwork at its native 1968 x 1568 size.
     left/top is the circle's top-left corner; width/height is its
     diameter. All five buttons sit at the same height and size, so
     top/height match across all of them — only left differs. */
  .hotspot { top: 77.87%; height: 17.86%; width: 14.23%; }
  .hotspot-1 { left: 9.65%;  }  /* Crab Stories    */
  .hotspot-2 { left: 26.27%; }  /* Meet the Crab   */
  .hotspot-3 { left: 42.89%; }  /* Crab Facts      */
  .hotspot-4 { left: 59.70%; }  /* Activity Corner */
  .hotspot-5 { left: 76.42%; }  /* Contact         */

  /* On a portrait phone the picture is zoomed/cropped (see "ABOUT
     THE MOBILE (PORTRAIT) LAYOUT" up top) so these circles would no
     longer land on the painted buttons — the menu button takes over
     navigation instead, so the hotspots are simply hidden. */
  body.is-portrait .hotspot { display: none; }

  /* Respects the visitor's "reduce motion" accessibility setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>

<body>

  <div class="plate" id="plate">

    <!-- EDIT: to use a different picture, change the filename here
         AND the IMG_W / IMG_H lines in the script at the bottom. The
         title, byline, wooden sign and five buttons are painted into
         this picture — see "ABOUT THE TITLE, BUTTONS AND WOODEN
         SIGN" up top. -->
    <img src="images/mainpagebackground.webp" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — a cheerful red crab on a rocky cove shoreline, with a lighthouse, seagulls, fish, and five buttons: Crab Stories, Meet the Crab, Crab Facts, Activity Corner and Contact">

    <!-- EDIT: the five link hotspots — see "ABOUT THE LINK
         HOTSPOTS" up top. Change href to point one elsewhere. -->
    <a class="hotspot hotspot-1" href="/stories/stories-index" aria-label="Crab Stories" title="Crab Stories"></a>
    <a class="hotspot hotspot-2" href="/about/aboutcrabby" aria-label="Meet the Crab" title="Meet the Crab"></a>
    <a class="hotspot hotspot-3" href="/coming-soon" aria-label="Crab Facts" title="Crab Facts"></a>
    <a class="hotspot hotspot-4" href="/activity-corner" aria-label="Activity Corner" title="Activity Corner"></a>
    <a class="hotspot hotspot-5" href="/coming-soon" aria-label="Contact" title="Contact"></a>

  </div>

  <!-- EDIT: the mobile menu button + dropdown — see "ABOUT THE
       MOBILE (PORTRAIT) LAYOUT" up top. Only visible on a portrait
       phone; hidden entirely otherwise. Its five links are a second
       copy of the hotspot links above — keep both in sync. -->
  <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="mobile-nav" id="mobile-nav">
    <a href="/stories/stories-index">Crab Stories</a>
    <a href="/about/aboutcrabby">Meet the Crab</a>
    <a href="/coming-soon">Crab Facts</a>
    <a href="/activity-corner">Activity Corner</a>
    <a href="/coming-soon">Contact</a>
  </nav>

<script>
(function () {
  // The picture's real pixel size. EDIT these two numbers if you swap
  // in a differently shaped image — everything else adapts
  // automatically (including the hotspot circles, since they're
  // positioned in percentages of the picture's own box).
  var IMG_W = 1968;
  var IMG_H = 1568;

  // How much of the picture's edges we'll ever let a screen's shape
  // crop away. The title, byline, sign and buttons are painted right
  // across this artwork with almost no safe margin, so these are
  // kept tiny — the picture is shown almost exactly in full (a photo
  // "contain" fit) rather than cropped to fill the screen. Raise
  // these only a little, and only if you're sure the new artwork has
  // safe margin to spare.
  var MAX_V_CROP = 0.01;
  var MAX_H_CROP = 0.01;

  // On a portrait phone (see "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up
  // top) the picture is zoomed to fill the screen and cropped at the
  // sides — FOCUS_X is which point of the artwork, in its own pixels
  // (0-1968), stays centred on screen while that happens. It's set
  // to sit right on Crabby himself.
  var FOCUS_X = 480;

  var plate = document.getElementById('plate');
  var img = plate.querySelector('img');
  var menuBtn = document.getElementById('menu-btn');
  var mobileNav = document.getElementById('mobile-nav');

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Picks the picture's on-screen size for wide/landscape screens:
  // as large as possible while still fitting entirely inside the
  // screen (like a photo "contain" fit), capped so it can never crop
  // more than the small limits above — on a screen shaped a little
  // differently from the artwork, that leaves a thin strip of the
  // page background at an edge instead of ever cropping into the
  // title, sign or buttons.
  function containScale(W, H) {
    var scaleW = W / IMG_W;
    var scaleH = H / IMG_H;
    var contain = Math.min(scaleW, scaleH);
    var scale = Math.max(scaleW, scaleH);
    var vBound = H / (IMG_H * (1 - 2 * MAX_V_CROP));
    var hBound = W / (IMG_W * (1 - 2 * MAX_H_CROP));
    scale = Math.min(scale, vBound, hBound);
    return Math.max(scale, contain);
  }

  function closeMenu() {
    document.body.classList.remove('menu-open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  function fit() {
    var W = document.documentElement.clientWidth;
    var H = document.documentElement.clientHeight;
    var mobile = H > W;   // portrait — see "ABOUT THE MOBILE (PORTRAIT) LAYOUT"

    document.body.classList.toggle('is-portrait', mobile);
    if (!mobile) closeMenu();

    plate.classList.toggle('mode-mobile', mobile);

    if (mobile) {
      // Fill the screen completely (photo "cover" fit using the
      // picture's real height, so nothing is cropped top-to-bottom)
      // and crop the sides only, keeping FOCUS_X centred.
      var scale = Math.max(W / IMG_W, H / IMG_H);
      var plateW = IMG_W * scale;

      var offsetPx = FOCUS_X * scale - W / 2;
      offsetPx = clamp(offsetPx, 0, Math.max(0, plateW - W));
      var posFrac = (plateW - W) > 0 ? offsetPx / (plateW - W) : 0.5;
      img.style.objectPosition = (posFrac * 100) + '% 50%';
    } else {
      var s = containScale(W, H);
      var plateW2 = Math.ceil(IMG_W * s);
      var plateH2 = Math.ceil(IMG_H * s);
      plate.style.width  = plateW2 + 'px';
      plate.style.height = plateH2 + 'px';
      img.style.objectPosition = '50% 50%';
    }
  }

  menuBtn.addEventListener('click', function () {
    var open = document.body.classList.toggle('menu-open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // tapping a menu link, or tapping anywhere outside the open menu,
  // closes it again
  mobileNav.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') closeMenu();
  });
  document.addEventListener('click', function (e) {
    if (!document.body.classList.contains('menu-open')) return;
    if (mobileNav.contains(e.target) || menuBtn.contains(e.target)) return;
    closeMenu();
  });

  fit();
  window.addEventListener('resize', fit);
})();
</script>

</body></html>

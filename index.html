<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title data-i18n="pageTitle">The Adventures of Crabby</title>

<!-- EDIT: the one-line description search engines show -->
<meta name="description" content="The Adventures of Crabby — a children's picture book.">

<meta property="og:title" content="The Adventures of Crabby">
<meta property="og:description" content="A children's picture book">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thecheekycrab.com/">
<meta property="og:image" content="https://thecheekycrab.com/images/mainpagebackground.webp">

<style>
  /* ==========================================================
     COLOURS — sampled from the illustration so the page and the
     picture blend into one another. Change these to restyle.
     ========================================================== */
  :root {
    --paper: #fbf4dd;   /* page background — matches the artwork's edge */
    --ink:   #163a5c;   /* the lettering — deep navy                    */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    position: relative;
    overflow: hidden;      /* the picture is centred in the viewport,
                              so the page itself never scrolls */
  }

  /* The picture sits inside this box. Its width/height are set in
     pixels by the script at the bottom of the page — see "ABOUT THE
     PICTURE FILLING THE SCREEN". The five hotspot links below are
     positioned in percentages of THIS box, so they track the
     picture's five painted buttons automatically at any size. */
  .plate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rise 1s cubic-bezier(.22,.61,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 14px)); }
    to   { opacity: 1; transform: translate(-50%, -50%);              }
  }

  /* EDIT: on a portrait phone the script (see "ABOUT THE MOBILE
     (PORTRAIT) LAYOUT" up top) adds this class instead of sizing
     the plate to the picture's own shape — it makes the plate fill
     the whole screen edge-to-edge so the picture can be zoomed in
     and cropped to fit, rather than letterboxed. */
  .plate.mode-mobile {
    position: fixed;
    inset: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;   /* the picture itself is drawn oversized and
                           nudged into place by the script below, so
                           this clips it to the screen's edges rather
                           than the page scrolling to show the excess */
    transform: none;
    animation: fade-in .6s ease both;
  }

  /* EDIT (technical note): on a portrait phone the picture is NOT
     sized with object-fit/object-position — the script below instead
     gives the visible <img> itself an explicit oversized pixel
     width/height (which a plain <img>, left at its default object-fit,
     simply stretches to fill — harmless here since the script always
     computes that width/height in the picture's own proportions, so
     "stretching" to them never distorts it) and nudges it into place
     with top/left, inside the overflow: hidden box above. This is a
     deliberately old-fashioned, very widely-supported way to do a
     "cover" crop. Earlier versions of this page tried object-fit:
     none/cover here instead and hit two different problems: with
     none, the picture ignores this width/height entirely and always
     draws at its own native pixel size, so the "crop" the script
     computed was never actually applied — the picture just appeared
     zoomed in at whatever size the file happens to be; with cover,
     one phone didn't repaint the picture at its new size after the
     script resized its box, leaving it at an earlier, smaller size
     while the box around it was correctly sized (a gap of plain page
     background below the picture, with the crop landing in the wrong
     spot). Leaving object-fit unset and driving both dimensions from
     the script avoids both. */
  .plate.mode-mobile img {
    position: absolute;
    top: 0;
    left: 0;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .plate img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* EDIT: the phone-only picture (see "ABOUT THE MOBILE (PORTRAIT)
     LAYOUT" up top) is a completely different image file from the
     wide-screen one, so only one of the two <img> elements inside
     .plate is ever shown at a time — this swaps between them based
     on body.is-portrait, which the script sets. */
  .mobile-img { display: none; }

  body.is-portrait .desktop-img { display: none; }
  body.is-portrait .mobile-img  { display: block; }

  /* ===================== MOBILE MENU ===================== */
  /* EDIT: the round menu button — only shown on portrait phones (see
     "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up top). Hidden entirely
     otherwise.

     It sits just to the right of the "f" in "...of Crabby", instead
     of a fixed corner, because a plain top/right percentage can't do
     that safely: the "f" 's ink ends at x=937 in the picture's own
     1200x1550 pixels, and on the narrower common phones the visible
     slice of the picture only reaches about x=948 before running off
     the edge of the screen — there's only a few pixels of picture
     left over for the button, not fifty. So this button isn't placed
     with CSS top/right at all: left/top are set in the script below
     (search MENU_BTN_IMG_X), which works out exactly where that same
     picture point (x=970, y=80 — just past the "f", vertically
     centred on it) lands on THIS phone's screen, the same way the
     picture itself is kept centred, and gently slides the button
     back onto the screen if a phone is too narrow to show that point
     with the full button beside it. left/top/transform below are
     just placeholder values for the instant before the script first
     runs. If you ever redo the portrait picture or its title, re-open
     it at native size and update MENU_BTN_IMG_X/Y in the script to
     the new "just past the last letter" spot. */
  .menu-btn {
    display: none;
    position: fixed;
    left: 50%;
    top: 80px;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 4px 14px rgba(90, 66, 30, .35);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
  }

  .menu-btn span {
    display: block;
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: var(--ink);
    transition: transform .2s ease, opacity .2s ease;
  }

  body.is-portrait .menu-btn { display: flex; }

  /* the "X" cross the menu button turns into once the menu is open */
  body.menu-open .menu-btn span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  body.menu-open .menu-btn span:nth-child(2) { opacity: 0; }
  body.menu-open .menu-btn span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* EDIT: the dropdown list of links itself. Hidden by default;
     "menu-open" on <body> (toggled by the button's click handler
     in the script) slides it into view. Its left/top (the true
     left edge and top edge, in pixels) are set in the script right
     alongside the button's — search MENU_BTN_IMG_X — so it always
     opens directly under wherever the button ended up; the left/top
     below are just placeholder values for the instant before the
     script first runs. The transition/transform here only ever
     handles the vertical open/close slide — never the left/right
     placement, which is the script's job alone. */
  .mobile-nav {
    position: fixed;
    left: calc(50% - 95px);
    top: 110px;
    transform: translateY(-8px);
    z-index: 19;
    display: none;
    flex-direction: column;
    gap: 8px;
    background: rgba(255, 255, 255, .96);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(90, 66, 30, .35);
    padding: 14px;
    min-width: 190px;
    opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
  }

  body.is-portrait .mobile-nav { display: flex; }

  body.is-portrait.menu-open .mobile-nav {
    opacity: 1;
    transform: translateY(0);
  }

  .mobile-nav a {
    display: block;
    padding: 10px 14px;
    border-radius: 9px;
    background: #f4ecd8;
    color: var(--ink);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
  }

  .mobile-nav a:active { background: #ecdfc0; }

  /* EDIT: the Language section at the bottom of the phone menu */
  .mobile-nav { width: 250px; max-width: calc(100vw - 16px); }
  .nav-lang {
    margin-top: 4px;
    padding-top: 10px;
    border-top: 1px solid rgba(22, 58, 92, .15);
    text-align: center;
  }
  .nav-lang-label {
    display: block;
    margin-bottom: 8px;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: .7;
  }

  /* the top-right Language picker is for wide screens only */
  body.is-portrait .landing-lang { display: none; }

  /* EDIT: the five invisible clickable circles sat on top of the
     picture's own painted buttons — see "ABOUT THE LINK HOTSPOTS"
     up top. They have no visible fill by default; a very soft
     highlight appears on hover/focus so visitors can tell they're
     clickable. */
  .hotspot {
    position: absolute;
    border-radius: 50%;
    display: block;
    -webkit-tap-highlight-color: rgba(22, 58, 92, .15);
  }

  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(255, 255, 255, .18);
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
  }

  /* HOTSPOT POSITIONS — percentages of the picture's own box,
     measured from the artwork at its native 1968 x 1568 size.
     left/top is the circle's top-left corner; width/height is its
     diameter. All five buttons sit at the same height and size, so
     top/height match across all of them — only left differs. */
  .hotspot { top: 77.87%; height: 17.86%; width: 14.23%; }
  .hotspot-1 { left: 9.65%;  }  /* Crab Stories    */
  .hotspot-2 { left: 26.27%; }  /* Meet the Crab   */
  .hotspot-3 { left: 42.89%; }  /* Crab Facts      */
  .hotspot-4 { left: 59.70%; }  /* Activity Corner */
  .hotspot-5 { left: 76.42%; }  /* Feedback        */

  /* On a portrait phone the phone-only picture doesn't have these
     buttons painted into it at all — the menu button takes over
     navigation instead, so the hotspots are simply hidden. */
  body.is-portrait .hotspot { display: none; }

  /* EDIT: the "Logged in as …" badge. On wide screens it sits in the
     top-left corner (the Language picker has the top-right); on a
     portrait phone it's at the top of the menu instead. It only
     appears when someone is logged in — see the script near the
     bottom of the page, search ACCOUNT BADGE. */
  .account-badge {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 30;
    display: none;
    align-items: center;
    gap: 10px;
    padding: 6px 14px 6px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 3px 12px rgba(90, 66, 30, .22);
    font: 600 15px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
          "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    max-width: calc(50vw - 30px);
  }
  .account-badge.is-on { display: inline-flex; }
  body.is-portrait .account-badge { display: none; }
  .account-icon { font-size: 22px; line-height: 1; }
  .account-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .account-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
  .account-name, .account-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-email { font-size: 12px; font-weight: 400; opacity: .8; }
  .account-logout {
    font: inherit; font-size: 13px; color: var(--ink);
    background: none; border: none; padding: 2px 0; cursor: pointer;
    text-decoration: underline; white-space: nowrap;
  }
  .account-logout:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

  /* the phone-menu copy of the badge */
  .nav-account {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding-bottom: 10px;
    margin-bottom: 2px;
    border-bottom: 1px solid rgba(22, 58, 92, .15);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    text-align: center;
  }
  .nav-account.is-on { display: flex; }
  .nav-account .account-name { font-weight: 700; font-size: 15px; max-width: 100%; }
  .nav-account .account-email { max-width: 100%; }

  /* Respects the visitor's "reduce motion" accessibility setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
<!-- Site-wide language switching (see lang/i18n.js) -->
<script src="lang/i18n.js"></script>
<!-- Links in the sign-up / password-reset emails land here; send them on to the Feedback page -->
<script>
  if (/(confirmation|recovery)_token=/.test(location.hash)) location.replace('/feedback' + location.hash);
</script>
</head>

<body>

  <div class="plate" id="plate" style="width: 0px; height: 0px;">

    <!-- EDIT: the wide-screen picture — see "ABOUT THE PICTURE
         FILLING THE SCREEN" up top. To use a different picture,
         change the filename here AND the IMG_W / IMG_H lines in the
         script at the bottom. The title, byline, wooden sign and
         five buttons are painted into this picture — see "ABOUT THE
         TITLE, BUTTONS AND WOODEN SIGN" up top. -->
    <img class="desktop-img" src="images/mainpagebackground.webp" data-i18n-alt="altDesktop" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — a cheerful red crab on a rocky cove shoreline, with a lighthouse, seagulls, fish, and five buttons: Crab Stories, Meet the Crab, Crab Facts, Activity Corner and Feedback" style="object-position: 50% 50%;">

    <!-- EDIT: the portrait-phone-only picture — see "ABOUT THE
         MOBILE (PORTRAIT) LAYOUT" up top. Change MOBILE_IMG_W /
         MOBILE_IMG_H in the script below to match if you replace
         this file. -->
    <img class="mobile-img" src="images/mainpagebackground-mobile.webp" data-i18n-alt="altMobile" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — Crabby the cheerful red crab on his rocky cove">

    <!-- EDIT: the five link hotspots — see "ABOUT THE LINK
         HOTSPOTS" up top. Change href to point one elsewhere. Only
         shown on wide/landscape screens. -->
    <a class="hotspot hotspot-1" href="/stories/stories-index" aria-label="Crab Stories" title="Crab Stories" data-i18n-aria-label="navStories" data-i18n-title="navStories"></a>
    <a class="hotspot hotspot-2" href="/about/aboutcrabby" aria-label="Meet the Crab" title="Meet the Crab" data-i18n-aria-label="navMeet" data-i18n-title="navMeet"></a>
    <a class="hotspot hotspot-3" href="/coming-soon" aria-label="Crab Facts" title="Crab Facts" data-i18n-aria-label="navFacts" data-i18n-title="navFacts"></a>
    <a class="hotspot hotspot-4" href="/activity-corner/activity-corner-index" aria-label="Activity Corner" title="Activity Corner" data-i18n-aria-label="navActivity" data-i18n-title="navActivity"></a>
    <a class="hotspot hotspot-5" href="/feedback" aria-label="Feedback" title="Feedback" data-i18n-aria-label="navContact" data-i18n-title="navContact"></a>

  </div>

  <!-- EDIT: the mobile menu button + dropdown — see "ABOUT THE
       MOBILE (PORTRAIT) LAYOUT" up top. Only visible on a portrait
       phone; hidden entirely otherwise. Its five links are a second
       copy of the hotspot links above — keep both in sync. -->
  <button class="menu-btn" id="menu-btn" data-i18n-aria-label="openMenu" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="mobile-nav" id="mobile-nav">
    <!-- who's logged in (only shown when someone is) -->
    <div class="nav-account" data-account>
      <span class="account-label" data-i18n="loggedInAs">Logged in as</span>
      <span class="account-name" data-account-name></span>

      <button type="button" class="account-logout" data-account-logout data-i18n="logOut">Log out</button>
    </div>
    <a href="/stories/stories-index" data-i18n="navStories">Crab Stories</a>
    <a href="/about/aboutcrabby" data-i18n="navMeet">Meet the Crab</a>
    <a href="/coming-soon" data-i18n="navFacts">Crab Facts</a>
    <a href="/activity-corner/activity-corner-index" data-i18n="navActivity">Activity Corner</a>
    <a href="/feedback" data-i18n="navContact">Feedback</a>

    <!-- EDIT: the Language choice in the menu. The buttons themselves
         are added by lang/i18n.js, which also translates the whole site. -->
    <div class="nav-lang">
      <span class="nav-lang-label" data-i18n="language">Language</span>
      <div data-lang-chips></div>
    </div>
  </nav>

  <!-- EDIT: the "🌐 Language" picker in the top-right corner on wide
       screens (on a portrait phone it's in the menu instead). Built by
       lang/i18n.js. -->
  <div class="landing-lang" data-lang-picker data-fixed></div>

  <!-- EDIT: the "Logged in as …" badge, top-left on wide screens -->
  <div class="account-badge" data-account>
    <span class="account-icon" aria-hidden="true">🦀</span>
    <span class="account-text">
      <span class="account-label" data-i18n="loggedInAs">Logged in as</span>
      <span class="account-name" data-account-name></span>
      <span class="account-email" data-account-email></span>
    </span>
    <button type="button" class="account-logout" data-account-logout data-i18n="logOut">Log out</button>
  </div>

<script>
(function () {
  // The wide-screen picture's real pixel size. EDIT these two
  // numbers if you swap in a differently shaped image — everything
  // else adapts automatically (including the hotspot circles, since
  // they're positioned in percentages of the picture's own box).
  var IMG_W = 1968;
  var IMG_H = 1568;

  // How much of the wide-screen picture's edges we'll ever let a
  // screen's shape crop away. The title, byline, sign and buttons
  // are painted right across this artwork with almost no safe
  // margin, so these are kept tiny — the picture is shown almost
  // exactly in full (a photo "contain" fit) rather than cropped to
  // fill the screen. Raise these only a little, and only if you're
  // sure the new artwork has safe margin to spare.
  var MAX_V_CROP = 0.01;
  var MAX_H_CROP = 0.01;

  // The portrait-phone-only picture's real pixel size — see "ABOUT
  // THE MOBILE (PORTRAIT) LAYOUT" up top. EDIT these two numbers to
  // match if you ever replace images/mainpagebackground-mobile.webp.
  var MOBILE_IMG_W = 1200;
  var MOBILE_IMG_H = 1550;

  // Which point of the phone-only picture, in its own pixels
  // (0-MOBILE_IMG_W), stays centred on screen when a narrow phone
  // needs a little edge crop to fill the screen exactly. Both the
  // title strip and the Crabby strip in that picture were built
  // centred on this same line, so a small crop here trims roughly
  // equal margin from both sides rather than cutting into either.
  var MOBILE_FOCUS_X = MOBILE_IMG_W / 2;

  // Where the round menu button sits, as a point in the phone-only
  // picture's own pixels (same 1200x1550 space as MOBILE_IMG_W/H
  // above) — just past the "f" of "...of Crabby", vertically
  // centred on that word. The "f" 's ink ends at x=937, so 970
  // clears it with a little breathing room. positionMenuBtn() below
  // works out where this point actually lands on each phone's own
  // screen (the same way coverFit works out where to show the
  // picture itself) and nudges the button back onto the screen if a
  // phone is too narrow to show this point with the whole button
  // beside it. EDIT these two numbers if you ever redo the portrait
  // picture's title.
  var MENU_BTN_IMG_X = 970;
  var MENU_BTN_IMG_Y = 80;

  var plate = document.getElementById('plate');
  var desktopImg = plate.querySelector('.desktop-img');
  var mobileImg  = plate.querySelector('.mobile-img');
  var menuBtn = document.getElementById('menu-btn');
  var mobileNav = document.getElementById('mobile-nav');

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Picks the picture's on-screen size for wide/landscape screens:
  // as large as possible while still fitting entirely inside the
  // screen (like a photo "contain" fit), capped so it can never crop
  // more than the small limits above — on a screen shaped a little
  // differently from the artwork, that leaves a thin strip of the
  // page background at an edge instead of ever cropping into the
  // title, sign or buttons.
  function containScale(W, H) {
    var scaleW = W / IMG_W;
    var scaleH = H / IMG_H;
    var contain = Math.min(scaleW, scaleH);
    var scale = Math.max(scaleW, scaleH);
    var vBound = H / (IMG_H * (1 - 2 * MAX_V_CROP));
    var hBound = W / (IMG_W * (1 - 2 * MAX_H_CROP));
    scale = Math.min(scale, vBound, hBound);
    return Math.max(scale, contain);
  }

  function closeMenu() {
    document.body.classList.remove('menu-open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  // Sizes and positions one <img> to fill W x H completely (a photo
  // "cover" fit), scaling up until it's at least as wide AND at
  // least as tall as the box, then nudging it with negative top/left
  // so the slice centred on focusX shows through. Shared by the
  // mobile picture (see "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up top
  // for why plain width/height/top/left is used instead of
  // object-fit/object-position).
  function coverFit(imgEl, W, H, srcW, srcH, focusX) {
    var scale = Math.max(W / srcW, H / srcH);
    var scaledW = srcW * scale;
    var scaledH = srcH * scale;

    var offsetX = focusX * scale - W / 2;
    offsetX = clamp(offsetX, 0, Math.max(0, scaledW - W));

    // Vertical crop only matters on the rare screen shape where
    // width, not height, ends up driving the scale above — this
    // keeps the picture centred top-to-bottom rather than pinned to
    // the top in that case.
    var offsetY = clamp((scaledH - H) / 2, 0, Math.max(0, scaledH - H));

    imgEl.style.width  = scaledW + 'px';
    imgEl.style.height = scaledH + 'px';
    imgEl.style.top  = (-offsetY) + 'px';
    imgEl.style.left = (-offsetX) + 'px';
  }

  function resetImg(imgEl) {
    imgEl.style.width = '';
    imgEl.style.height = '';
    imgEl.style.top = '';
    imgEl.style.left = '';
  }

  // Works out where MENU_BTN_IMG_X/Y (a fixed point in the phone
  // picture's own pixels) lands on THIS phone's screen — the exact
  // same scale/offset coverFit() just used to place the picture
  // itself — then puts the button there, sliding it back onto the
  // screen (never off the edge) if a phone is too narrow to show
  // that point with the whole button still on-screen. The dropdown
  // list is placed right under wherever the button ended up.
  function positionMenuBtn(W, H) {
    var scale = Math.max(W / MOBILE_IMG_W, H / MOBILE_IMG_H);
    var scaledW = MOBILE_IMG_W * scale;
    var scaledH = MOBILE_IMG_H * scale;
    var offsetX = clamp(MOBILE_FOCUS_X * scale - W / 2, 0, Math.max(0, scaledW - W));
    var offsetY = clamp((scaledH - H) / 2, 0, Math.max(0, scaledH - H));

    var btnX = MENU_BTN_IMG_X * scale - offsetX;
    var btnY = MENU_BTN_IMG_Y * scale - offsetY;

    var half = (menuBtn.offsetWidth || 44) / 2;
    var margin = 8;
    btnX = clamp(btnX, half + margin, W - half - margin);
    btnY = clamp(btnY, half + margin, H - half - margin);

    menuBtn.style.left = btnX + 'px';
    menuBtn.style.top  = btnY + 'px';

    // measure the menu at the far left first, so its current spot
    // near the screen edge can't squeeze it narrower than it wants to be
    mobileNav.style.left = '0px';
    var navWidth = mobileNav.offsetWidth || 190;
    var navLeft = clamp(btnX - navWidth / 2, margin, W - navWidth - margin);
    mobileNav.style.left = navLeft + 'px';
    mobileNav.style.top  = (btnY + half + 10) + 'px';
  }

  // The most reliable read of "how much screen is actually visible
  // right now" on a phone. window.visualViewport tracks the space
  // left once the browser's own address bar / toolbar are accounted
  // for, and updates live as they show or hide — plain
  // document.documentElement.clientWidth/Height can lag behind that
  // on some mobile browsers, which is what let a phone's toolbar
  // state leave a gap of page background below the picture.
  function viewportSize() {
    if (window.visualViewport) {
      return { W: window.visualViewport.width, H: window.visualViewport.height };
    }
    return { W: document.documentElement.clientWidth, H: document.documentElement.clientHeight };
  }

  function fit() {
    var size = viewportSize();
    var W = size.W;
    var H = size.H;
    var mobile = H > W;   // portrait — see "ABOUT THE MOBILE (PORTRAIT) LAYOUT"

    document.body.classList.toggle('is-portrait', mobile);
    if (!mobile) closeMenu();

    plate.classList.toggle('mode-mobile', mobile);

    if (mobile) {
      // Fill the screen completely with the phone-only picture (see
      // "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up top) — the box is
      // sized here in exact pixels from the same W/H the crop math
      // uses, rather than leaning on the CSS class's width:100%/
      // height:100% alone, for the reasons explained by the
      // ".plate.mode-mobile img" technical note in the style
      // section.
      plate.style.width  = W + 'px';
      plate.style.height = H + 'px';
      coverFit(mobileImg, W, H, MOBILE_IMG_W, MOBILE_IMG_H, MOBILE_FOCUS_X);
      positionMenuBtn(W, H);
      resetImg(desktopImg);
    } else {
      var s = containScale(W, H);
      var plateW2 = Math.ceil(IMG_W * s);
      var plateH2 = Math.ceil(IMG_H * s);
      plate.style.width  = plateW2 + 'px';
      plate.style.height = plateH2 + 'px';

      // Reset the mobile-mode pixel sizing above back to the plain
      // CSS width:100%/height:100%/object-fit:cover the desktop
      // picture uses on a wide screen (see ".plate img" in the style
      // section).
      resetImg(desktopImg);
      desktopImg.style.objectPosition = '50% 50%';
      resetImg(mobileImg);
    }
  }

  menuBtn.addEventListener('click', function () {
    fit();   // re-measure the menu first — its width depends on the language
    var open = document.body.classList.toggle('menu-open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // tapping a menu link, or tapping anywhere outside the open menu,
  // closes it again
  mobileNav.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') closeMenu();
  });
  document.addEventListener('click', function (e) {
    if (!document.body.classList.contains('menu-open')) return;
    if (mobileNav.contains(e.target) || menuBtn.contains(e.target)) return;
    closeMenu();
  });

  fit();

  // Re-fit on every signal a phone can send that the visible area
  // changed: a plain window resize, an orientation flip (with a
  // short delay, since some phones briefly report the old size right
  // as it happens), the visual viewport itself changing size (this
  // is the one that actually fires when a phone's address bar shows
  // or hides — plain window "resize" often does not), and the page
  // being restored from the browser's back/forward cache (e.g. the
  // visitor switches back to an already-open tab) rather than freshly
  // loaded, in case the screen changed shape while it was hidden.
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('pageshow', fit);

  // the menu's words change length with the language, so re-place it
  CrabbyLang.onChange(fit);
})();
</script>

<!-- ACCOUNT BADGE: shows who's logged in. The log-in itself happens on
     the Feedback page (account/feedback.js), which saves the reader's
     name and email in their browser under "crabby-session"; this just
     reads it back. -->
<script>
(function () {
  var KEY = 'crabby-session';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function show() {
    var s = load(), u = s && s.user;
    var on = !!(u && (u.name || u.email));
    Array.prototype.forEach.call(document.querySelectorAll('[data-account]'), function (el) {
      el.classList.toggle('is-on', on);
      if (!on) return;
      el.querySelector('[data-account-name]').textContent = u.name || u.email;
      var em = el.querySelector('[data-account-email]');
      em.textContent = u.name ? (u.email || '') : '';
      em.style.display = em.textContent ? '' : 'none';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('[data-account-logout]')) return;
    var s = load();
    if (s && s.access_token) {
      fetch('/.netlify/identity/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } }).catch(function () {});
    }
    try { localStorage.removeItem(KEY); } catch (err) {}
    show();
  });
  // keeps the badge right if they log in or out in another tab
  window.addEventListener('storage', function (e) { if (e.key === KEY) show(); });
  window.addEventListener('pageshow', show);
  show();
})();
</script>

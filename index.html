<!--
  ============================================================
  thecheekycrab.com  —  The Adventures of Crabby
  ============================================================

  This is the site's home page. The whole site is:

      index.html                          this file — the home page
      about/aboutcrabby.html              the "About Crabby" page
      about/aboutsofia.html               the "About Sofia" page
      stories/stories-index.html     the "Stories" list page (links to every story)
      activity-corner.html                the "Activity Corner" page (games based on the stories)
      coming-soon.html                    placeholder for the not-yet-built pages
      images/mainpagebackground.webp      this page's illustration (wide screens)
      images/mainpagebackground-mobile.webp  this page's illustration (portrait phones)
      images/Crabby Image.png             the About Crabby thumbnail
      images/Sofia Image.png              the About Sofia thumbnail
      images/Mango Ice Cream Stall.png    the Stories link's thumbnail

      The stories themselves (crabby-and-the-mango-ice-cream.html and
      their pictures) live in stories/ and images/ too, but aren't
      linked directly from this page any more — see "ABOUT THE LINK
      HOTSPOTS" below.

  HOW TO EDIT IT
  --------------
  Open this file in a plain text editor. VS Code is free and
  ideal; Notepad works. Do NOT open or save it in Microsoft
  Word — Word rewrites it into broken markup.

  Everything you're likely to change is marked with a comment
  beginning "EDIT:". The colours live together in the :root
  block near the top of the style section.

  To preview a change: save, then double-click index.html. It
  opens in your browser. Edit, save, refresh.

  ABOUT THE TITLE, BUTTONS AND WOODEN SIGN
  --------------------------------------
  The title ("The Adventures of Crabby"), the byline, the intro
  sentence, and the five round buttons along the bottom (Crab
  Stories / Meet the Crab / Crab Facts / Activity Corner /
  Contact) are all part of the illustration itself
  (images/mainpagebackground.webp) — they're painted into the
  picture, not drawn separately by this page. To change any of
  that wording or artwork, you need a new illustration with the
  new text/buttons baked in; this file has no separate lettering
  to edit for those. What this page DOES add on top is five
  invisible clickable circles, positioned exactly on top of
  those five painted buttons — see "ABOUT THE LINK HOTSPOTS"
  below.

  ABOUT THE PICTURE FILLING THE SCREEN (wide/landscape screens)
  --------------------------------------
  The picture is sized by the script at the bottom of the page,
  not by CSS alone, because every visitor's screen is a different
  shape from the artwork (1968 x 1568) and the picture has to be
  shown in full, without ever stretching, distorting, or cropping
  into the title lettering, the sign, or the row of round buttons.

  Because the title/sign/buttons stretch right across the artwork
  with almost no safe margin, the script fits the picture like a
  photo "contain" fit: it grows the picture until it's as large as
  possible while still fitting entirely inside the screen, then
  centres it. On a screen shaped very differently from the artwork
  (e.g. a tall phone), that leaves a thin strip of the page
  background (--paper) above/below or left/right of the picture,
  rather than ever cropping any of it away. The two numbers
  MAX_V_CROP and MAX_H_CROP near the top of the script allow a
  small amount of edge crop instead of letterboxing, if you ever
  want a more edge-to-edge look — raise them cautiously, since the
  title, sign and buttons now run close to every edge.

  This "contain" approach is only used on wide/landscape screens.
  A portrait phone uses a completely different picture — see
  "ABOUT THE MOBILE (PORTRAIT) LAYOUT" below.

  ABOUT THE LINK HOTSPOTS
  ----------------------
  Five invisible, circular clickable areas sit right on top of the
  five round buttons painted into the picture ("Crab Stories",
  "Meet the Crab", "Crab Facts", "Activity Corner", "Contact").
  Because they're positioned in PERCENTAGES of the picture's own
  box (not fixed pixels), they land in exactly the right spot on
  the buttons no matter how large or small the picture is drawn —
  no JavaScript positioning math is needed for them.

  Each hotspot is a plain <a class="hotspot"> inside the .plate div
  in the BODY section, with its own class (hotspot-1 .. hotspot-5)
  giving it a left/top/width/height in the style section, all as
  percentages. If you ever need to nudge one (say, a future
  illustration shifts the buttons slightly), adjust that hotspot's
  percentages in the "HOTSPOT POSITIONS" part of the style section
  — open the picture at its native size, find the button's pixel
  box, and convert to percent of 1968 (width) / 1568 (height).

  These hotspots only apply on wide/landscape screens — a portrait
  phone uses the pull-down menu instead (see below), because the
  phone picture doesn't have the buttons painted into it at all.

  ABOUT THE MOBILE (PORTRAIT) LAYOUT
  --------------------------------------
  A portrait phone does NOT reuse the wide illustration above.
  images/mainpagebackground-mobile.webp is a second, separate
  picture — built specifically for phones — that restacks pieces
  of the same illustration into a taller, portrait-shaped image:
  the title/byline banner on top, and a close-up of Crabby on his
  rocky cove underneath. It deliberately leaves out the row of
  five round buttons entirely (there's no room for them on a
  phone, and they'd be too small to tap), which is also why this
  page adds the pull-down menu button instead — see below.

  EDIT: to redo this picture (say, once a new illustration exists),
  open images/mainpagebackground.webp at full size, and:
    1. crop the title + byline banner as one horizontal strip
       (keep a good margin either side of the lettering, not a
       tight crop right up against it — this page zooms in and
       crops the sides a little on narrow phones, and lettering
       right at the edge of the strip risks being cut off).
    2. crop Crabby himself as a second horizontal strip lower down
       (again with margin around him, avoiding the row of buttons
       painted at the very bottom).
    3. scale both strips to the same width and stack the title
       strip directly above the Crabby strip, and save the result
       as images/mainpagebackground-mobile.webp.
  Then update MOBILE_IMG_W / MOBILE_IMG_H in the script below to
  match the new file's exact pixel size (its width and height —
  check the file's properties, or open it in any image editor).

  Because this picture is much taller relative to its width than
  the wide illustration, this page can show the *entire* title AND
  the *entire* crab on a phone screen, one above the other, rather
  than the impossible choice of cropping into one or the other on
  a wide picture. On the narrowest phones the script below still
  crops a little off the left/right edges to fill the screen
  edge-to-edge (rather than leaving blank paper-coloured strips) —
  MOBILE_FOCUS_X (also in the script) is the horizontal centre-line
  both strips were built around, so that small edge crop trims
  roughly equal margin from both sides rather than cutting into the
  lettering or Crabby himself.

  EDIT (technical note): on a phone, the picture's box is sized in
  exact pixels taken from window.visualViewport (falling back to the
  page's own width/height if a browser doesn't support that), rather
  than trusting CSS alone to fill the screen. A phone's address bar
  showing or hiding changes how much screen is actually visible, and
  plain CSS percentage sizing can briefly disagree with what this
  script measures when that happens. The script re-measures and
  re-applies this on every signal a phone can send that the visible
  area changed — resize, orientation change, the visual viewport
  itself changing, and the page being shown again from the browser's
  cache — so it self-corrects rather than getting stuck.

  On top of that, the picture itself is drawn at an oversized pixel
  width/height and nudged into place with plain top/left (inside a
  box with overflow: hidden), with object-fit deliberately left
  unset — see the technical note by ".plate.mode-mobile img" in the
  style section for the two different problems this page ran into
  with object-fit: none and object-fit: cover there instead. Leave
  both of these in place if you ever edit this script.

  Because there are no buttons painted into the phone picture, a
  small round menu button appears in the top-right corner on a
  portrait phone instead — tapping it drops down a plain list of
  the same five links. That menu's HTML is the
  <nav class="mobile-nav"> block in the BODY section, right after
  the .plate div; its five links are a second, independent copy of
  the hotspot links used on wide screens, so if you change a
  destination in one place, change it in the other too.

  Currently:
    - "Crab Stories"    → /stories/stories-index (the page listing
                           every story)
    - "Meet the Crab"    → /about/aboutcrabby
    - "Activity Corner"  → /activity-corner (word search, quiz,
                           story-ordering game, colouring page and
                           a writing space, all based on the two
                           stories so far)
    - "Crab Facts" and "Contact" both → coming-soon.html, a small
      placeholder page that just says "Under Construction — check
      back soon" until those sections are built.
  ============================================================
--><html lang="en-AU"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title>The Adventures of Crabby</title>

<!-- EDIT: the one-line description search engines show -->
<meta name="description" content="The Adventures of Crabby — a children's picture book.">

<meta property="og:title" content="The Adventures of Crabby">
<meta property="og:description" content="A children's picture book">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thecheekycrab.com/">
<meta property="og:image" content="https://thecheekycrab.com/images/mainpagebackground.webp">

<style>
  /* ==========================================================
     COLOURS — sampled from the illustration so the page and the
     picture blend into one another. Change these to restyle.
     ========================================================== */
  :root {
    --paper: #fbf4dd;   /* page background — matches the artwork's edge */
    --ink:   #163a5c;   /* the lettering — deep navy                    */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    position: relative;
    overflow: hidden;      /* the picture is centred in the viewport,
                              so the page itself never scrolls */
  }

  /* The picture sits inside this box. Its width/height are set in
     pixels by the script at the bottom of the page — see "ABOUT THE
     PICTURE FILLING THE SCREEN". The five hotspot links below are
     positioned in percentages of THIS box, so they track the
     picture's five painted buttons automatically at any size. */
  .plate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rise 1s cubic-bezier(.22,.61,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 14px)); }
    to   { opacity: 1; transform: translate(-50%, -50%);              }
  }

  /* EDIT: on a portrait phone the script (see "ABOUT THE MOBILE
     (PORTRAIT) LAYOUT" up top) adds this class instead of sizing
     the plate to the picture's own shape — it makes the plate fill
     the whole screen edge-to-edge so the picture can be zoomed in
     and cropped to fit, rather than letterboxed. */
  .plate.mode-mobile {
    position: fixed;
    inset: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;   /* the picture itself is drawn oversized and
                           nudged into place by the script below, so
                           this clips it to the screen's edges rather
                           than the page scrolling to show the excess */
    transform: none;
    animation: fade-in .6s ease both;
  }

  /* EDIT (technical note): on a portrait phone the picture is NOT
     sized with object-fit/object-position — the script below instead
     gives the visible <img> itself an explicit oversized pixel
     width/height (which a plain <img>, left at its default object-fit,
     simply stretches to fill — harmless here since the script always
     computes that width/height in the picture's own proportions, so
     "stretching" to them never distorts it) and nudges it into place
     with top/left, inside the overflow: hidden box above. This is a
     deliberately old-fashioned, very widely-supported way to do a
     "cover" crop. Earlier versions of this page tried object-fit:
     none/cover here instead and hit two different problems: with
     none, the picture ignores this width/height entirely and always
     draws at its own native pixel size, so the "crop" the script
     computed was never actually applied — the picture just appeared
     zoomed in at whatever size the file happens to be; with cover,
     one phone didn't repaint the picture at its new size after the
     script resized its box, leaving it at an earlier, smaller size
     while the box around it was correctly sized (a gap of plain page
     background below the picture, with the crop landing in the wrong
     spot). Leaving object-fit unset and driving both dimensions from
     the script avoids both. */
  .plate.mode-mobile img {
    position: absolute;
    top: 0;
    left: 0;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .plate img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* EDIT: the phone-only picture (see "ABOUT THE MOBILE (PORTRAIT)
     LAYOUT" up top) is a completely different image file from the
     wide-screen one, so only one of the two <img> elements inside
     .plate is ever shown at a time — this swaps between them based
     on body.is-portrait, which the script sets. */
  .mobile-img { display: none; }

  body.is-portrait .desktop-img { display: none; }
  body.is-portrait .mobile-img  { display: block; }

  /* ===================== MOBILE MENU ===================== */
  /* EDIT: the round menu button — only shown on portrait phones (see
     "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up top). Hidden entirely
     otherwise.

     It sits over open water beside Crabby rather than in the
     top-right corner, because the picture's title ("...of Crabby")
     runs right across the top of the portrait picture — a
     top-right-corner button always ended up sitting on the "f" of
     "of". top/right are PERCENTAGES of the screen, not pixels,
     because a portrait phone always shows the picture's full height
     (see coverFit's notes up top) — so a height-percentage lines up
     with the same clear patch of water on every phone, tall or
     short. If you ever redo the portrait picture, re-check this
     still lands on open water (open the picture at its native
     1200x1550 size — see MOBILE_IMG_W/H below — the clear patch
     next to Crabby's shell is roughly x 750-950, y 545-650). */
  .menu-btn {
    display: none;
    position: fixed;
    top: 36%;
    right: 12%;
    z-index: 20;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 4px 14px rgba(90, 66, 30, .35);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }

  .menu-btn span {
    display: block;
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: var(--ink);
    transition: transform .2s ease, opacity .2s ease;
  }

  body.is-portrait .menu-btn { display: flex; }

  /* the "X" cross the menu button turns into once the menu is open */
  body.menu-open .menu-btn span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  body.menu-open .menu-btn span:nth-child(2) { opacity: 0; }
  body.menu-open .menu-btn span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* EDIT: the dropdown list of links itself. Hidden by default;
     "menu-open" on <body> (toggled by the button's click handler
     in the script) slides it into view. Positioned just below the
     button above (same right offset, top = button's top + its own
     height + a small gap) so it always opens directly under it. */
  .mobile-nav {
    position: fixed;
    top: calc(36% + 60px);
    right: 12%;
    z-index: 19;
    display: none;
    flex-direction: column;
    gap: 8px;
    background: rgba(255, 255, 255, .96);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(90, 66, 30, .35);
    padding: 14px;
    min-width: 190px;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .18s ease, transform .18s ease;
  }

  body.is-portrait .mobile-nav { display: flex; }

  body.is-portrait.menu-open .mobile-nav {
    opacity: 1;
    transform: translateY(0);
  }

  .mobile-nav a {
    display: block;
    padding: 10px 14px;
    border-radius: 9px;
    background: #f4ecd8;
    color: var(--ink);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
  }

  .mobile-nav a:active { background: #ecdfc0; }

  /* EDIT: the five invisible clickable circles sat on top of the
     picture's own painted buttons — see "ABOUT THE LINK HOTSPOTS"
     up top. They have no visible fill by default; a very soft
     highlight appears on hover/focus so visitors can tell they're
     clickable. */
  .hotspot {
    position: absolute;
    border-radius: 50%;
    display: block;
    -webkit-tap-highlight-color: rgba(22, 58, 92, .15);
  }

  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(255, 255, 255, .18);
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
  }

  /* HOTSPOT POSITIONS — percentages of the picture's own box,
     measured from the artwork at its native 1968 x 1568 size.
     left/top is the circle's top-left corner; width/height is its
     diameter. All five buttons sit at the same height and size, so
     top/height match across all of them — only left differs. */
  .hotspot { top: 77.87%; height: 17.86%; width: 14.23%; }
  .hotspot-1 { left: 9.65%;  }  /* Crab Stories    */
  .hotspot-2 { left: 26.27%; }  /* Meet the Crab   */
  .hotspot-3 { left: 42.89%; }  /* Crab Facts      */
  .hotspot-4 { left: 59.70%; }  /* Activity Corner */
  .hotspot-5 { left: 76.42%; }  /* Contact         */

  /* On a portrait phone the phone-only picture doesn't have these
     buttons painted into it at all — the menu button takes over
     navigation instead, so the hotspots are simply hidden. */
  body.is-portrait .hotspot { display: none; }

  /* Respects the visitor's "reduce motion" accessibility setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>

<body>

  <div class="plate" id="plate">

    <!-- EDIT: the wide-screen picture — see "ABOUT THE PICTURE
         FILLING THE SCREEN" up top. To use a different picture,
         change the filename here AND the IMG_W / IMG_H lines in the
         script at the bottom. The title, byline, wooden sign and
         five buttons are painted into this picture — see "ABOUT THE
         TITLE, BUTTONS AND WOODEN SIGN" up top. -->
    <img class="desktop-img" src="images/mainpagebackground.webp" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — a cheerful red crab on a rocky cove shoreline, with a lighthouse, seagulls, fish, and five buttons: Crab Stories, Meet the Crab, Crab Facts, Activity Corner and Contact">

    <!-- EDIT: the portrait-phone-only picture — see "ABOUT THE
         MOBILE (PORTRAIT) LAYOUT" up top. Change MOBILE_IMG_W /
         MOBILE_IMG_H in the script below to match if you replace
         this file. -->
    <img class="mobile-img" src="images/mainpagebackground-mobile.webp" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — Crabby the cheerful red crab on his rocky cove">

    <!-- EDIT: the five link hotspots — see "ABOUT THE LINK
         HOTSPOTS" up top. Change href to point one elsewhere. Only
         shown on wide/landscape screens. -->
    <a class="hotspot hotspot-1" href="/stories/stories-index" aria-label="Crab Stories" title="Crab Stories"></a>
    <a class="hotspot hotspot-2" href="/about/aboutcrabby" aria-label="Meet the Crab" title="Meet the Crab"></a>
    <a class="hotspot hotspot-3" href="/coming-soon" aria-label="Crab Facts" title="Crab Facts"></a>
    <a class="hotspot hotspot-4" href="/activity-corner" aria-label="Activity Corner" title="Activity Corner"></a>
    <a class="hotspot hotspot-5" href="/coming-soon" aria-label="Contact" title="Contact"></a>

  </div>

  <!-- EDIT: the mobile menu button + dropdown — see "ABOUT THE
       MOBILE (PORTRAIT) LAYOUT" up top. Only visible on a portrait
       phone; hidden entirely otherwise. Its five links are a second
       copy of the hotspot links above — keep both in sync. -->
  <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="mobile-nav" id="mobile-nav">
    <a href="/stories/stories-index">Crab Stories</a>
    <a href="/about/aboutcrabby">Meet the Crab</a>
    <a href="/coming-soon">Crab Facts</a>
    <a href="/activity-corner">Activity Corner</a>
    <a href="/coming-soon">Contact</a>
  </nav>

<script>
(function () {
  // The wide-screen picture's real pixel size. EDIT these two
  // numbers if you swap in a differently shaped image — everything
  // else adapts automatically (including the hotspot circles, since
  // they're positioned in percentages of the picture's own box).
  var IMG_W = 1968;
  var IMG_H = 1568;

  // How much of the wide-screen picture's edges we'll ever let a
  // screen's shape crop away. The title, byline, sign and buttons
  // are painted right across this artwork with almost no safe
  // margin, so these are kept tiny — the picture is shown almost
  // exactly in full (a photo "contain" fit) rather than cropped to
  // fill the screen. Raise these only a little, and only if you're
  // sure the new artwork has safe margin to spare.
  var MAX_V_CROP = 0.01;
  var MAX_H_CROP = 0.01;

  // The portrait-phone-only picture's real pixel size — see "ABOUT
  // THE MOBILE (PORTRAIT) LAYOUT" up top. EDIT these two numbers to
  // match if you ever replace images/mainpagebackground-mobile.webp.
  var MOBILE_IMG_W = 1200;
  var MOBILE_IMG_H = 1550;

  // Which point of the phone-only picture, in its own pixels
  // (0-MOBILE_IMG_W), stays centred on screen when a narrow phone
  // needs a little edge crop to fill the screen exactly. Both the
  // title strip and the Crabby strip in that picture were built
  // centred on this same line, so a small crop here trims roughly
  // equal margin from both sides rather than cutting into either.
  var MOBILE_FOCUS_X = MOBILE_IMG_W / 2;

  var plate = document.getElementById('plate');
  var desktopImg = plate.querySelector('.desktop-img');
  var mobileImg  = plate.querySelector('.mobile-img');
  var menuBtn = document.getElementById('menu-btn');
  var mobileNav = document.getElementById('mobile-nav');

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Picks the picture's on-screen size for wide/landscape screens:
  // as large as possible while still fitting entirely inside the
  // screen (like a photo "contain" fit), capped so it can never crop
  // more than the small limits above — on a screen shaped a little
  // differently from the artwork, that leaves a thin strip of the
  // page background at an edge instead of ever cropping into the
  // title, sign or buttons.
  function containScale(W, H) {
    var scaleW = W / IMG_W;
    var scaleH = H / IMG_H;
    var contain = Math.min(scaleW, scaleH);
    var scale = Math.max(scaleW, scaleH);
    var vBound = H / (IMG_H * (1 - 2 * MAX_V_CROP));
    var hBound = W / (IMG_W * (1 - 2 * MAX_H_CROP));
    scale = Math.min(scale, vBound, hBound);
    return Math.max(scale, contain);
  }

  function closeMenu() {
    document.body.classList.remove('menu-open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  // Sizes and positions one <img> to fill W x H completely (a photo
  // "cover" fit), scaling up until it's at least as wide AND at
  // least as tall as the box, then nudging it with negative top/left
  // so the slice centred on focusX shows through. Shared by the
  // mobile picture (see "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up top
  // for why plain width/height/top/left is used instead of
  // object-fit/object-position).
  function coverFit(imgEl, W, H, srcW, srcH, focusX) {
    var scale = Math.max(W / srcW, H / srcH);
    var scaledW = srcW * scale;
    var scaledH = srcH * scale;

    var offsetX = focusX * scale - W / 2;
    offsetX = clamp(offsetX, 0, Math.max(0, scaledW - W));

    // Vertical crop only matters on the rare screen shape where
    // width, not height, ends up driving the scale above — this
    // keeps the picture centred top-to-bottom rather than pinned to
    // the top in that case.
    var offsetY = clamp((scaledH - H) / 2, 0, Math.max(0, scaledH - H));

    imgEl.style.width  = scaledW + 'px';
    imgEl.style.height = scaledH + 'px';
    imgEl.style.top  = (-offsetY) + 'px';
    imgEl.style.left = (-offsetX) + 'px';
  }

  function resetImg(imgEl) {
    imgEl.style.width = '';
    imgEl.style.height = '';
    imgEl.style.top = '';
    imgEl.style.left = '';
  }

  // The most reliable read of "how much screen is actually visible
  // right now" on a phone. window.visualViewport tracks the space
  // left once the browser's own address bar / toolbar are accounted
  // for, and updates live as they show or hide — plain
  // document.documentElement.clientWidth/Height can lag behind that
  // on some mobile browsers, which is what let a phone's toolbar
  // state leave a gap of page background below the picture.
  function viewportSize() {
    if (window.visualViewport) {
      return { W: window.visualViewport.width, H: window.visualViewport.height };
    }
    return { W: document.documentElement.clientWidth, H: document.documentElement.clientHeight };
  }

  function fit() {
    var size = viewportSize();
    var W = size.W;
    var H = size.H;
    var mobile = H > W;   // portrait — see "ABOUT THE MOBILE (PORTRAIT) LAYOUT"

    document.body.classList.toggle('is-portrait', mobile);
    if (!mobile) closeMenu();

    plate.classList.toggle('mode-mobile', mobile);

    if (mobile) {
      // Fill the screen completely with the phone-only picture (see
      // "ABOUT THE MOBILE (PORTRAIT) LAYOUT" up top) — the box is
      // sized here in exact pixels from the same W/H the crop math
      // uses, rather than leaning on the CSS class's width:100%/
      // height:100% alone, for the reasons explained by the
      // ".plate.mode-mobile img" technical note in the style
      // section.
      plate.style.width  = W + 'px';
      plate.style.height = H + 'px';
      coverFit(mobileImg, W, H, MOBILE_IMG_W, MOBILE_IMG_H, MOBILE_FOCUS_X);
      resetImg(desktopImg);
    } else {
      var s = containScale(W, H);
      var plateW2 = Math.ceil(IMG_W * s);
      var plateH2 = Math.ceil(IMG_H * s);
      plate.style.width  = plateW2 + 'px';
      plate.style.height = plateH2 + 'px';

      // Reset the mobile-mode pixel sizing above back to the plain
      // CSS width:100%/height:100%/object-fit:cover the desktop
      // picture uses on a wide screen (see ".plate img" in the style
      // section).
      resetImg(desktopImg);
      desktopImg.style.objectPosition = '50% 50%';
      resetImg(mobileImg);
    }
  }

  menuBtn.addEventListener('click', function () {
    var open = document.body.classList.toggle('menu-open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // tapping a menu link, or tapping anywhere outside the open menu,
  // closes it again
  mobileNav.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') closeMenu();
  });
  document.addEventListener('click', function (e) {
    if (!document.body.classList.contains('menu-open')) return;
    if (mobileNav.contains(e.target) || menuBtn.contains(e.target)) return;
    closeMenu();
  });

  fit();

  // Re-fit on every signal a phone can send that the visible area
  // changed: a plain window resize, an orientation flip (with a
  // short delay, since some phones briefly report the old size right
  // as it happens), the visual viewport itself changing size (this
  // is the one that actually fires when a phone's address bar shows
  // or hides — plain window "resize" often does not), and the page
  // being restored from the browser's back/forward cache (e.g. the
  // visitor switches back to an already-open tab) rather than freshly
  // loaded, in case the screen changed shape while it was hidden.
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('pageshow', fit);
})();
</script>

</body></html>

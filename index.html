<!--

  thecheekycrab.com  —  The Adventures of Crabby
  ============================================================

  This is the site's home page. The whole site is:

      index.html                          this file — the home page
      about/aboutcrabby.html              the "About Crabby" page
      about/aboutsofia.html               the "About Sofia" page
      stories/stories-index.html     the "Stories" list page (links to every story)
      images/mainpagebackground.webp      this page's illustration
      images/Crabby Image.png             the About Crabby thumbnail

      images/Mango Ice Cream Stall.png    the Stories link's thumbnail

      The stories themselves (crabby-and-the-mango-ice-cream.html and

      linked directly from this page any more — see "ABOUT THE LINK
      CARDS" below.

  HOW TO EDIT IT
  --------------
  Open this file in a plain text editor. VS Code is free and
  ideal; Notepad works. Do NOT open or save it in Microsoft
  Word — Word rewrites it into broken markup.

  Everything you're likely to change is marked with a comment
  beginning "EDIT:". The colours live together in the :root
  block near the top of the style section.

  To preview a change: save, then double-click index.html. It
  opens in your browser. Edit, save, refresh.

  ABOUT THE TITLE AND THE WOODEN SIGN
  --------------------------------------
  The title ("The Adventures of Crabby"), the byline, the intro
  sentence, and the hanging "Kind hearts..." wooden sign are all
  now part of the illustration itself (images/mainpagebackground.webp)
  — they're painted into the picture, not drawn separately by this
  page. To change any of that wording, you need a new illustration
  with the new text baked in; this file has no separate lettering
  to edit.

  ABOUT THE PICTURE FILLING THE SCREEN
  --------------------------------------
  The picture is sized by the script at the bottom of the page,
  not by CSS alone, because every visitor's screen is a different
  shape from the artwork (1152 x 922) and the picture has to be
  shown in full, without ever stretching, distorting, or cropping
  into the title lettering or the sign at the top.

  Because the title/sign/text stretch right across the top of the
  artwork with almost no safe margin, the script fits the picture
  like a photo "contain" fit: it grows the picture until it's as
  large as possible while still fitting entirely inside the screen,
  then centres it. On a screen shaped very differently from the
  artwork (e.g. a tall phone), that leaves a thin strip of the page
  background (--paper) above/below or left/right of the picture,
  rather than ever cropping any of it away. The two numbers
  MAX_V_CROP and MAX_H_CROP near the top of the script allow a
  small amount of edge crop instead of letterboxing, if you ever
  want a more edge-to-edge look — raise them cautiously, since the
  title and sign now run close to every edge.

  ABOUT THE LINK CARDS
  ----------------------
  Bottom-left of the screen are three plain text link buttons, all
  the same size, sat in a row: "About Crabby" (/about/aboutcrabby),
  "About Sofia" (/about/aboutsofia), and "Stories"
  (/stories/stories-index — the page listing every story).

  They're pinned to the picture's own bottom-left corner by the
  script at the bottom (falling back to the screen corner when the
  picture fills the screen edge-to-edge), so they always stay fully
  on-screen and tappable, even when the picture is letterboxed. They
  share their look (size, rounded corners, shadow) from the
  ".about-link" rule in the style section,
  and their size/position/spacing/font-size in the script's fit()
  function (the linkW / linkH / linkGap / linkFontSize lines). To
  add another link here: copy one of the <a class="about-link ...">
  lines in the BODY section, give it a new class name, add it to the
  [crabbyLink, sofiaLink, storiesLink] list in fit(), and grab its
  element with document.querySelector near the top of the script.
  ============================================================
--><html lang="en-AU"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title>The Adventures of Crabby</title>

<!-- EDIT: the one-line description search engines show -->
<meta name="description" content="The Adventures of Crabby — a children's picture book.">

<meta property="og:title" content="The Adventures of Crabby">
<meta property="og:description" content="A children's picture book">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thecheekycrab.com/">
<meta property="og:image" content="https://thecheekycrab.com/images/mainpagebackground.webp">

<style>
  /* ==========================================================
     COLOURS — sampled from the illustration so the page and the
     picture blend into one another. Change these to restyle.
     ========================================================== */
  :root {
    --paper: #fbf4dd;   /* page background — matches the artwork's edge */
    --ink:   #163a5c;   /* the lettering — deep navy                    */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    position: relative;   /* the link buttons are pinned to the
                              picture's corner, with body as their
                              anchor — see "ABOUT THE LINK CARDS" */
    overflow: hidden;      /* the picture is centred in the viewport,
                              so the page itself never scrolls */
  }

  /* The picture sits inside this box. Its width/height are set in
     pixels by the script at the bottom of the page — see "ABOUT THE
     PICTURE FILLING THE SCREEN". */
  .plate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rise 1s cubic-bezier(.22,.61,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 14px)); }
    to   { opacity: 1; transform: translate(-50%, -50%);              }
  }

  .plate img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* EDIT: the "About Crabby" / "About Sofia" / "Stories" cards — see
     "ABOUT THE LINK CARDS" up top. Their position/width are set in
     pixels by the script at the bottom, not here — this rule only
     holds their shared look. */
  .about-link {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, .88);
    box-shadow: 0 4px 12px rgba(90, 66, 30, .25);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
    padding: 4px 6px;
  }

  .about-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(90, 66, 30, .32);
    background: #fff;
  }

  /* Respects the visitor's "reduce motion" accessibility setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>

<body>

  <div class="plate" id="plate">

    <!-- EDIT: to use a different picture, change the filename here
         AND the IMG_W / IMG_H lines in the script at the bottom. The
         title, byline and wooden sign are painted into this picture —
         see "ABOUT THE TITLE AND THE WOODEN SIGN" up top. -->
    <img src="images/mainpagebackground.webp" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — a cheerful red crab on a rocky cove shoreline, with a lighthouse on a cliff, seagulls overhead, and fish swimming in the bay">

  </div>

  <!-- EDIT: the "About Crabby" link — see "ABOUT THE LINK CARDS" up
         top. Change href to point it elsewhere; change the words
         inside the <a> for different link text. -->
    <a class="about-link link-crabby" href="/about/aboutcrabby">About Crabby</a>

    <!-- EDIT: the "About Sofia" link — same idea as the Crabby link
         above, positioned by ".link-sofia" in the style section. -->
    <a class="about-link link-sofia" href="/about/aboutsofia">About Sofia</a>

    <!-- EDIT: the "Stories" link — leads to the page listing every
         story. Positioned by ".link-stories" in the style section. -->
    <a class="about-link link-stories" href="/stories/stories-index" title="All of Crabby's stories">Stories</a>

  

<script>
(function () {
  // The picture's real pixel size. EDIT these two numbers if you swap
  // in a differently shaped image — everything else adapts
  // automatically.
  var IMG_W = 1152;
  var IMG_H = 922;

  // How much of the picture's edges we'll ever let a screen's shape
  // crop away. The title, byline and sign are painted right across
  // the top of this artwork with almost no safe margin, so these are
  // kept tiny — the picture is shown almost exactly in full (a photo
  // "contain" fit) rather than cropped to fill the screen. Raise
  // these only a little, and only if you're sure the new artwork has
  // safe margin to spare.
  var MAX_V_CROP = 0.01;
  var MAX_H_CROP = 0.01;

  var plate = document.getElementById('plate');
  var crabbyLink  = document.querySelector('a.link-crabby');
  var sofiaLink   = document.querySelector('a.link-sofia');
  var storiesLink = document.querySelector('a.link-stories');

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Picks the picture's on-screen size: as large as possible while
  // still fitting entirely inside the screen (like a photo "contain"
  // fit), capped so it can never crop more than the small limits
  // above — on a screen shaped very differently from the artwork,
  // that leaves a thin strip of the page background at an edge
  // instead of ever cropping into the title or sign.
  function coverScale(W, H) {
    var scaleW = W / IMG_W;
    var scaleH = H / IMG_H;
    var contain = Math.min(scaleW, scaleH);
    var scale = Math.max(scaleW, scaleH);
    var vBound = H / (IMG_H * (1 - 2 * MAX_V_CROP));
    var hBound = W / (IMG_W * (1 - 2 * MAX_H_CROP));
    scale = Math.min(scale, vBound, hBound);
    return Math.max(scale, contain);
  }

  // Sizes the picture, then pins the three link buttons to the
  // picture's own bottom-left corner, clamped so they never drift
  // off-screen. On a screen shaped very differently from the artwork
  // (e.g. a tall phone with this landscape artwork), the picture is
  // letterboxed with a strip of --paper showing above/below or
  // left/right of it (see coverScale) — in that case the links sit
  // just inside the PICTURE's edge, not stranded out in the blank
  // paper strip.
  function fit() {
    var W = document.documentElement.clientWidth;
    var H = document.documentElement.clientHeight;
    var s = coverScale(W, H);

    var plateW = Math.ceil(IMG_W * s);
    var plateH = Math.ceil(IMG_H * s);
    plate.style.width  = plateW + 'px';
    plate.style.height = plateH + 'px';

    // How far the picture's edge sits inside the screen's edge on each
    // axis. Positive = letterboxed (a paper gap on that axis); zero or
    // negative = the picture fills/overflows the screen on that axis.
    var marginX = (W - plateW) / 2;
    var marginY = (H - plateH) / 2;

    // EDIT: these clamp(min, preferred, max) values control the link
    // sizing/spacing at every screen size. The three links are plain
    // text buttons, all the same width and height (linkW / linkH),
    // sat in a row with linkGap between them.
    var pad     = clamp(W * 0.025, 10, 40);
    var linkW   = clamp(W * 0.15,  84, 128);
    var linkH   = clamp(W * 0.045, 34, 46);
    var linkGap = clamp(W * 0.015, 6, 14);
    var linkFontSize = clamp(W * 0.017, 11, 15);

    // Padding from the screen edge, pulled in further when there's a
    // letterbox gap so the links land on the picture, not on the
    // blank paper beside/below it.
    var padX = pad + Math.max(0, marginX);
    var padY = pad + Math.max(0, marginY);

    [crabbyLink, sofiaLink, storiesLink].forEach(function (link, i) {
      link.style.left       = (padX + i * (linkW + linkGap)) + 'px';
      link.style.bottom     = padY + 'px';
      link.style.width      = linkW + 'px';
      link.style.height     = linkH + 'px';
      link.style.fontSize   = linkFontSize + 'px';
    });
  }

  fit();
  window.addEventListener('resize', fit);
})();
</script>

</body></html>

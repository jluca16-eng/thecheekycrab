  HOW TO EDIT IT
  --------------
  Open this file in a plain text editor. VS Code is free and
  ideal; Notepad works. Do NOT open or save it in Microsoft
  Word — Word rewrites it into broken markup.

  Everything you're likely to change is marked with a comment
  beginning "EDIT:". The colours live together in the :root
  block near the top of the style section.

  To preview a change: save, then double-click index.html. It
  opens in your browser. Edit, save, refresh.

  ABOUT THE TITLE, BUTTONS AND WOODEN SIGN
  --------------------------------------
  The title ("The Adventures of Crabby"), the byline, the intro
  sentence, and the five round buttons along the bottom (Crab
  Stories / Meet the Crab / Crab Facts / Activity Corner /
  Contact) are all part of the illustration itself
  (images/mainpagebackground.webp) — they're painted into the
  picture, not drawn separately by this page. To change any of
  that wording or artwork, you need a new illustration with the
  new text/buttons baked in; this file has no separate lettering
  to edit for those. What this page DOES add on top is five
  invisible clickable circles, positioned exactly on top of
  those five painted buttons — see "ABOUT THE LINK HOTSPOTS"
  below.

  ABOUT THE PICTURE FILLING THE SCREEN
  --------------------------------------
  The picture is sized by the script at the bottom of the page,
  not by CSS alone, because every visitor's screen is a different
  shape from the artwork (1968 x 1568) and the picture has to be
  shown in full, without ever stretching, distorting, or cropping
  into the title lettering, the sign, or the row of round buttons.

  Because the title/sign/buttons stretch right across the artwork
  with almost no safe margin, the script fits the picture like a
  photo "contain" fit: it grows the picture until it's as large as
  possible while still fitting entirely inside the screen, then
  centres it. On a screen shaped very differently from the artwork
  (e.g. a tall phone), that leaves a thin strip of the page
  background (--paper) above/below or left/right of the picture,
  rather than ever cropping any of it away. The two numbers
  MAX_V_CROP and MAX_H_CROP near the top of the script allow a
  small amount of edge crop instead of letterboxing, if you ever
  want a more edge-to-edge look — raise them cautiously, since the
  title, sign and buttons now run close to every edge.

  ABOUT THE LINK HOTSPOTS
  ----------------------
  Five invisible, circular clickable areas sit right on top of the
  five round buttons painted into the picture ("Crab Stories",
  "Meet the Crab", "Crab Facts", "Activity Corner", "Contact").
  Because they're positioned in PERCENTAGES of the picture's own
  box (not fixed pixels), they land in exactly the right spot on
  the buttons no matter how large or small the picture is drawn —
  no JavaScript positioning math is needed for them.

  Each hotspot is a plain <a class="hotspot"> inside the .plate div
  in the BODY section, with its own class (hotspot-1 .. hotspot-5)
  giving it a left/top/width/height in the style section, all as
  percentages. If you ever need to nudge one (say, a future
  illustration shifts the buttons slightly), adjust that hotspot's
  percentages in the "HOTSPOT POSITIONS" part of the style section
  — open the picture at its native size, find the button's pixel
  box, and convert to percent of 1968 (width) / 1568 (height).

  Currently:
    - "Crab Stories"    → /stories/stories-index (the page listing
                           every story)
    - "Meet the Crab"    → /about/aboutcrabby
    - "Activity Corner"  → /activity-corner (word search, quiz,
                           story-ordering game, colouring page and
                           a writing space, all based on the two
                           stories so far)
    - "Crab Facts" and "Contact" both → coming-soon.html, a small
      placeholder page that just says "Under Construction — check
      back soon" until those sections are built.
  ============================================================
--><html lang="en-AU"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title>The Adventures of Crabby</title>

<!-- EDIT: the one-line description search engines show -->
<meta name="description" content="The Adventures of Crabby — a children's picture book.">

<meta property="og:title" content="The Adventures of Crabby">
<meta property="og:description" content="A children's picture book">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thecheekycrab.com/">
<meta property="og:image" content="https://thecheekycrab.com/images/mainpagebackground.webp">

<style>
  /* ==========================================================
     COLOURS — sampled from the illustration so the page and the
     picture blend into one another. Change these to restyle.
     ========================================================== */
  :root {
    --paper: #fbf4dd;   /* page background — matches the artwork's edge */
    --ink:   #163a5c;   /* the lettering — deep navy                    */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    position: relative;
    overflow: hidden;      /* the picture is centred in the viewport,
                              so the page itself never scrolls */
  }

  /* The picture sits inside this box. Its width/height are set in
     pixels by the script at the bottom of the page — see "ABOUT THE
     PICTURE FILLING THE SCREEN". The five hotspot links below are
     positioned in percentages of THIS box, so they track the
     picture's five painted buttons automatically at any size. */
  .plate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: rise 1s cubic-bezier(.22,.61,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 14px)); }
    to   { opacity: 1; transform: translate(-50%, -50%);              }
  }

  .plate img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* EDIT: the five invisible clickable circles sat on top of the
     picture's own painted buttons — see "ABOUT THE LINK HOTSPOTS"
     up top. They have no visible fill by default; a very soft
     highlight appears on hover/focus so visitors can tell they're
     clickable. */
  .hotspot {
    position: absolute;
    border-radius: 50%;
    display: block;
    -webkit-tap-highlight-color: rgba(22, 58, 92, .15);
  }

  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(255, 255, 255, .18);
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
  }

  /* HOTSPOT POSITIONS — percentages of the picture's own box,
     measured from the artwork at its native 1968 x 1568 size.
     left/top is the circle's top-left corner; width/height is its
     diameter. All five buttons sit at the same height and size, so
     top/height match across all of them — only left differs. */
  .hotspot { top: 77.87%; height: 17.86%; width: 14.23%; }
  .hotspot-1 { left: 9.65%;  }  /* Crab Stories    */
  .hotspot-2 { left: 26.27%; }  /* Meet the Crab   */
  .hotspot-3 { left: 42.89%; }  /* Crab Facts      */
  .hotspot-4 { left: 59.70%; }  /* Activity Corner */
  .hotspot-5 { left: 76.42%; }  /* Contact         */

  /* Respects the visitor's "reduce motion" accessibility setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>

<body>

  <div class="plate" id="plate">

    <!-- EDIT: to use a different picture, change the filename here
         AND the IMG_W / IMG_H lines in the script at the bottom. The
         title, byline, wooden sign and five buttons are painted into
         this picture — see "ABOUT THE TITLE, BUTTONS AND WOODEN
         SIGN" up top. -->
    <img src="images/mainpagebackground.webp" alt="The Adventures of Crabby, by Kylie Luca and Sofia Kontorinis — a cheerful red crab on a rocky cove shoreline, with a lighthouse, seagulls, fish, and five buttons: Crab Stories, Meet the Crab, Crab Facts, Activity Corner and Contact">

    <!-- EDIT: the five link hotspots — see "ABOUT THE LINK
         HOTSPOTS" up top. Change href to point one elsewhere. -->
    <a class="hotspot hotspot-1" href="/stories/stories-index" aria-label="Crab Stories" title="Crab Stories"></a>
    <a class="hotspot hotspot-2" href="/about/aboutcrabby" aria-label="Meet the Crab" title="Meet the Crab"></a>
    <a class="hotspot hotspot-3" href="/coming-soon" aria-label="Crab Facts" title="Crab Facts"></a>
    <a class="hotspot hotspot-4" href="/activity-corner" aria-label="Activity Corner" title="Activity Corner"></a>
    <a class="hotspot hotspot-5" href="/coming-soon" aria-label="Contact" title="Contact"></a>

  </div>

<script>
(function () {
  // The picture's real pixel size. EDIT these two numbers if you swap
  // in a differently shaped image — everything else adapts
  // automatically (including the hotspot circles, since they're
  // positioned in percentages of the picture's own box).
  var IMG_W = 1968;
  var IMG_H = 1568;

  // How much of the picture's edges we'll ever let a screen's shape
  // crop away. The title, byline, sign and buttons are painted right
  // across this artwork with almost no safe margin, so these are
  // kept tiny — the picture is shown almost exactly in full (a photo
  // "contain" fit) rather than cropped to fill the screen. Raise
  // these only a little, and only if you're sure the new artwork has
  // safe margin to spare.
  var MAX_V_CROP = 0.01;
  var MAX_H_CROP = 0.01;

  var plate = document.getElementById('plate');

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Picks the picture's on-screen size: as large as possible while
  // still fitting entirely inside the screen (like a photo "contain"
  // fit), capped so it can never crop more than the small limits
  // above — on a screen shaped very differently from the artwork,
  // that leaves a thin strip of the page background at an edge
  // instead of ever cropping into the title, sign or buttons.
  function coverScale(W, H) {
    var scaleW = W / IMG_W;
    var scaleH = H / IMG_H;
    var contain = Math.min(scaleW, scaleH);
    var scale = Math.max(scaleW, scaleH);
    var vBound = H / (IMG_H * (1 - 2 * MAX_V_CROP));
    var hBound = W / (IMG_W * (1 - 2 * MAX_H_CROP));
    scale = Math.min(scale, vBound, hBound);
    return Math.max(scale, contain);
  }

  function fit() {
    var W = document.documentElement.clientWidth;
    var H = document.documentElement.clientHeight;
    var s = coverScale(W, H);

    var plateW = Math.ceil(IMG_W * s);
    var plateH = Math.ceil(IMG_H * s);
    plate.style.width  = plateW + 'px';
    plate.style.height = plateH + 'px';
  }

  fit();
  window.addEventListener('resize', fit);
})();
</script>

</body></html>

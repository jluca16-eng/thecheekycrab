<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title data-i18n="pageTitle">Stories — The Adventures of Crabby</title>

<meta name="description" content="All the stories from The Adventures of Crabby.">

<style>
  /* Custom fonts — files live in /fonts at the repo root. */
  @font-face {
    font-family: "Marelle Baton";
    src: url("../fonts/MarelleBaton-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Gill Sans MT Pro";
    src: url("../fonts/Gill_Sans_MT_Pro_Book.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Gill Sans MT Pro";
    src: url("../fonts/Gill_Sans_MT_Pro_Book_Italic.otf") format("opentype");
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  @font-face {
    font-family: "Gill Sans MT Pro";
    src: url("../fonts/Gill_Sans_MT_Pro_Bold_Italic.otf") format("opentype");
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }

  :root {
    --paper: #fbf4dd;   /* same page background as the rest of the site */
    --ink:   #163a5c;   /* same ink colour as the home page's title */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    padding: 50px 20px 90px;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
  }

  .back {
    display: inline-block;
    margin-bottom: 24px;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: var(--ink);
    text-decoration: none;
    opacity: .75;
  }

  .back:hover { opacity: 1; }

  /* EDIT: the heading wording */
  h1 {
    font-family: "Marelle Baton", cursive;
    font-weight: 400;
    font-size: 56px;
    color: var(--ink);
    text-align: center;
    margin-bottom: 30px;
  }

  /* The stack of story lines. */
  .story-list {
    display: flex;
    flex-direction: column;
  }

  /* EDIT: each story now sits in a row that holds two links side by
     side — the story itself, and a small button to that story's own
     activity page (in the activity-corner folder). */
  .story-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 6px;
    border-bottom: 1px solid rgba(22, 58, 92, .12);
  }

  .story-list .story-line:first-child { border-top: 1px solid rgba(22, 58, 92, .12); }

  .story-row {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
    text-decoration: none;
    transition: transform .15s ease, opacity .15s ease;
  }

  .story-row:hover {
    transform: translateX(4px);
    opacity: .85;
  }

  /* EDIT: the small "Activity" button linking to that story's own
     activity-corner page. */
  .activity-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
    transition: transform .15s ease, opacity .15s ease;
  }

  .activity-btn:hover {
    transform: translateY(-2px);
    opacity: .9;
  }

  /* EDIT: the link picture — same width (46px) as the About Crabby /
     About Sofia links on the home page, so the two feel matched. */
  .story-row img {
    display: block;
    width: 46px;
    height: auto;
    flex-shrink: 0;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(90, 66, 30, .25);
  }

  /* EDIT: the story's name next to its picture */
  .story-row span {
    font-family: "Gill Sans MT Pro", "Gill Sans MT", "Gill Sans", Calibri,
                 "Segoe UI", Arial, sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.15;
    color: var(--ink);
  }
</style>
<!-- Site-wide language switching (see lang/i18n.js) -->
<script src="../lang/i18n.js"></script>
</head>

<body>

  <div class="page">

    <a class="back" href="/" data-i18n="back">← Back</a>

    <h1 data-i18n="navStories">Stories</h1>

    <div class="story-list">

      <!-- EDIT: one line per story. Copy this whole block for a new one. -->
      <div class="story-line">
        <a class="story-row" href="/stories/crabby-and-the-mango-ice-cream">
          <img src="../images/Crabby%20Mango%20Ice%20Cream.png" alt="Crabby the Lego crab triumphantly holding a mango ice cream cone" data-i18n-alt="altMangoCone">
          <span data-i18n="titleMango">Crabby and the Mango Ice Cream</span>
        </a>
        <a class="activity-btn" href="/activity-corner/mango-ice-cream-activity" title="Try this story's activity" data-i18n-title="activityBtnTitle" data-i18n="activityBtn">🦀 Activity</a>
      </div>

      <div class="story-line">
        <a class="story-row" href="/stories/crabby-and-the-perfect-hiding-place">
          <img src="../images/Crabby%20and%20Sofia%20Windowsill.jpg" alt="Crabby the Lego crab watching Sofia brush her hair" data-i18n-alt="altWindowsill">
          <span data-i18n="titleHiding">Crabby and the Perfect Hiding Place</span>
        </a>
        <a class="activity-btn" href="/activity-corner/perfect-hiding-place-activity" title="Try this story's activity" data-i18n-title="activityBtnTitle" data-i18n="activityBtn">🦀 Activity</a>
      </div>

      <div class="story-line">
        <a class="story-row" href="/stories/crabby-goes-to-gardening-club">
          <img src="../images/Sofia%20and%20Emma%20Gardening.png" alt="Sofia and Emma kneeling in the school garden, weeding beside the tomato plants" data-i18n-alt="altGardening">
          <span data-i18n="titleGardening">Crabby goes to Gardening Club</span>
        </a>
      </div>

      <div class="story-line">
        <a class="story-row" href="/stories/crabby-goes-to-emmas-birthday-party">
          <img src="../images/Emma%20Party%20Jumping%20Castle.png" alt="Sofia jumping onto the Bounce Kingdom jumping castle at Emma&#x27;s birthday party" data-i18n-alt="altEmma">
          <span data-i18n="titleEmma">Crabby goes to Emma&#x27;s Birthday Party</span>
        </a>
      </div>

      <div class="story-line">
        <a class="story-row" href="/stories/crabby-goes-on-the-plane">
          <img src="../images/Sofia%20Asleep%20on%20the%20Plane.jpg" alt="Sofia asleep by the plane window, with Crabby peeking out of her ponytail" data-i18n-alt="altPlane">
          <span data-i18n="titlePlane">Crabby goes on the Plane</span>
        </a>
      </div>

      <div class="story-line">
        <a class="story-row" href="/stories/crabby-goes-to-buckingham-palace">
          <img src="../images/Sofia%20at%20Buckingham%20Palace.jpg" alt="Sofia outside Buckingham Palace with the guards in red coats and tall black hats, Crabby in her ponytail" data-i18n-alt="altPalace">
          <span data-i18n="titlePalace">Crabby goes to Buckingham Palace</span>
        </a>
      </div>

      <div class="story-line">
        <a class="story-row" href="/stories/crabby-goes-to-the-london-science-museum">
          <img src="../images/Sofia%20Science%20Museum%20Space.jpg" alt="Sofia in the Exploring Space gallery at the London Science Museum, with Crabby in her ponytail" data-i18n-alt="altScience">
          <span data-i18n="titleScience">Crabby goes to the London Science Museum</span>
        </a>
      </div>

    </div>

  </div>

</body></html>

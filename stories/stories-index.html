<!DOCTYPE html>
<!--
  ============================================================
  thecheekycrab.com  —  Stories
  ============================================================

  The stories landing page — this is where the big "Stories" link
  on the home page leads. It lists every story as one line each: a
  small picture (the same size as the About Crabby / About Sofia
  links on the home page) plus the story's name beside it. The
  whole line is one link, leading to that story's own page sitting
  right next to this file in the "stories" folder.

  HOW TO EDIT IT
  --------------
  Open this file in a plain text editor (VS Code, Notepad — not
  Microsoft Word).

  ADDING A NEW STORY LINE
  --------------------------
  Once a new story page exists (see the "ADDING MORE STORIES" note
  in crabby-and-the-mango-ice-cream.html), copy one whole
  <a class="story-row"> block down in the BODY section below, and
  change its href, picture and title to the new story's. New lines
  just stack below the existing ones — no layout changes needed.
  ============================================================
-->
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title>Stories — The Adventures of Crabby</title>

<meta name="description" content="All the stories from The Adventures of Crabby.">

<!-- Same lettering font as the rest of the site, for the heading here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #fbf4dd;   /* same page background as the rest of the site */
    --ink:   #163a5c;   /* same ink colour as the home page's title */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    padding: 50px 20px 90px;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
  }

  .back {
    display: inline-block;
    margin-bottom: 24px;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: var(--ink);
    text-decoration: none;
    opacity: .75;
  }

  .back:hover { opacity: 1; }

  /* EDIT: the heading wording */
  h1 {
    font-family: "Alex Brush", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: 56px;
    color: var(--ink);
    text-align: center;
    margin-bottom: 30px;
  }

  /* The stack of story lines. */
  .story-list {
    display: flex;
    flex-direction: column;
  }

  .story-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 6px;
    text-decoration: none;
    border-bottom: 1px solid rgba(22, 58, 92, .12);
    transition: transform .15s ease, opacity .15s ease;
  }

  .story-list a.story-row:first-child { border-top: 1px solid rgba(22, 58, 92, .12); }

  .story-row:hover {
    transform: translateX(4px);
    opacity: .85;
  }

  /* EDIT: the link picture — same width (46px) as the About Crabby /
     About Sofia links on the home page, so the two feel matched. */
  .story-row img {
    display: block;
    width: 46px;
    height: auto;
    flex-shrink: 0;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(90, 66, 30, .25);
  }

  /* EDIT: the story's name next to its picture */
  .story-row span {
    font-family: "Alex Brush", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.15;
    color: var(--ink);
  }
</style>
</head>

<body>

  <div class="page">

    <a class="back" href="../index.html">&larr; Back</a>

    <h1>Stories</h1>

    <div class="story-list">

      <!-- EDIT: one line per story. Copy this whole block for a new one. -->
      <a class="story-row" href="crabby-and-the-mango-ice-cream.html">
        <img src="../images/Crabby%20Mango%20Ice%20Cream.png" alt="Crabby the Lego crab triumphantly holding a mango ice cream cone">
        <span>Crabby and the Mango Ice Cream</span>
      </a>

      <a class="story-row" href="crabby-and-the-perfect-hiding-place.html">
        <img src="../images/Crabby%20and%20Sofia%20Windowsill.jpg" alt="Crabby the Lego crab watching Sofia brush her hair">
        <span>Crabby and the Perfect Hiding Place</span>
      </a>

    </div>

  </div>

</body>
</html>

<!DOCTYPE html>
<!--
  ============================================================
  thecheekycrab.com  —  Contact & Feedback   (/feedback)
  ============================================================

  The "Contact" button on the home page links here. Readers log in
  (or make an account) and then send feedback about the website or
  any story. The login + feedback box itself is built by
  account/feedback.js — its wording is in that file.

  IMPORTANT — the hidden <form name="feedback"> at the bottom of
  this page is how Netlify knows the feedback form exists. Keep it,
  even though nobody sees it. If you ever add a new field to the
  feedback box, add an input with the same name here too.

  Emails from Netlify Identity (sign-up confirmation, password
  reset) link to the home page, which forwards them here.
  ============================================================
-->
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title data-i18n="pageTitle">Contact &amp; Feedback — The Adventures of Crabby</title>

<meta name="description" content="Send Crabby your feedback about the stories and the website.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #fbf4dd;   /* same page background as the rest of the site */
    --ink:   #163a5c;   /* same ink colour as the home page's title */
    --text:  #2b2b2b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    padding: 50px 20px 90px;
  }

  .page { max-width: 720px; margin: 0 auto; }

  .back {
    display: inline-block;
    margin-bottom: 24px;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: var(--ink);
    text-decoration: none;
    opacity: .75;
  }
  .back:hover { opacity: 1; }

  /* EDIT: the heading wording */
  h1 {
    font-family: "Alex Brush", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: 50px;
    line-height: 1.15;
    color: var(--ink);
    text-align: center;
    margin-bottom: 14px;
  }

  .lead {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    color: var(--text);
    text-align: center;
    max-width: 520px;
    margin: 0 auto;
  }

  .feedback-box { margin-top: 30px; }
</style>
<!-- Site-wide language switching (see lang/i18n.js) -->
<script src="lang/i18n.js"></script>
</head>

<body>

  <div class="page">
    <a class="back" href="/" data-i18n="backToBeach">← Back to the beach</a>

    <h1 data-i18n="heading">Contact &amp; Feedback</h1>
    <p class="lead" data-i18n="lead">Crabby loves hearing from readers! Tell us which stories you enjoyed, what you'd change, or where Crabby should sneak off to next.</p>

    <!-- The login + feedback box is drawn here by account/feedback.js -->
    <div data-feedback></div>
  </div>

  <!-- Netlify reads this hidden form when the site is published, so it
       knows which fields the "feedback" form has. Don't remove it. -->
  <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="name">
    <input name="email">
    <input name="story">
    <input name="rating">
    <textarea name="message"></textarea>
    <input name="page">
    <input name="language">
  </form>

<script src="account/feedback.js"></script>

<!-- EDIT: translations of this page's labelled text (data-i18n="...") -->
<script>
CrabbyLang.add({
  "el": {
    "pageTitle": "Επικοινωνία και σχόλια — Οι περιπέτειες του Κράμπι",
    "heading": "Επικοινωνία και σχόλια",
    "lead": "Ο Κράμπι λατρεύει να ακούει νέα από τους αναγνώστες του! Πες μας ποιες ιστορίες σου άρεσαν, τι θα άλλαζες ή πού να τρυπώσει ο Κράμπι την επόμενη φορά."
  },
  "it": {
    "pageTitle": "Contatti e opinioni — Le avventure di Crabby",
    "heading": "Contatti e opinioni",
    "lead": "Crabby adora ricevere notizie dai lettori! Dicci quali storie ti sono piaciute, cosa cambieresti o dove dovrebbe intrufolarsi Crabby la prossima volta."
  },
  "fr": {
    "pageTitle": "Contact et avis — Les aventures de Crabby",
    "heading": "Contact et avis",
    "lead": "Crabby adore avoir des nouvelles de ses lecteurs ! Dis-nous quelles histoires tu as aimées, ce que tu changerais, ou où Crabby devrait se faufiler la prochaine fois."
  },
  "es": {
    "pageTitle": "Contacto y opiniones — Las aventuras de Crabby",
    "heading": "Contacto y opiniones",
    "lead": "¡A Crabby le encanta saber de sus lectores! Cuéntanos qué cuentos te gustaron, qué cambiarías o adónde debería colarse Crabby la próxima vez."
  }
});
</script>
</body>
</html>
